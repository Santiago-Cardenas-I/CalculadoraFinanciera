trigger:
  - master

pool:
  name: Default   # Tu agente local registrado en Azure DevOps

variables:
  projectDir: '.'
  # --- Variables agregadas para JMeter ---
  jmxFile: 'tests/stress_test_pipelines.jmx'
  resultsFolder: 'results'
  resultsFile: '$(resultsFolder)/results.jtl'
  htmlReport: '$(resultsFolder)/html'

steps:
  # Paso 1: Chequear el código
  - checkout: self

  # Paso 2: Verificar versión de Java instalada en el agente local
  - script: java -version
    displayName: "Verificar versión de Java (usando el del agente local)"
    workingDirectory: $(projectDir)

  # Paso 3: Ejecutar compilación y pruebas unitarias
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8 -Xmx3072m'
      publishJUnitResults: true
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
      tasks: 'clean build test'


  # PASO 4: Construir la Imagen de Docker (Justo después de compilar el .jar)
  - script: |
      echo "Construyendo la imagen Docker de la calculadora..."
      docker build -t calculadorafinanciera .
    displayName: "Docker: Construir Imagen"
    workingDirectory: '$(projectDir)'

  # Paso 5: Ejecutar pruebas de aceptación (Cucumber)
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'acceptanceTest'
      testResultsFiles: '**/build/test-results/acceptanceTest/TEST-*.xml'
      publishJUnitResults: true

  # Paso 6: Ejecutar pruebas de mutación (Pitest)
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'pitest'

  # Paso 7: (Opcional): Análisis con SonarQube
  - task: Gradle@2
    inputs:
      workingDirectory: '$(projectDir)'
      gradleWrapperFile: '$(projectDir)/gradlew'
      gradleOptions: '-Dfile.encoding=UTF-8'
      tasks: 'sonar'
    env:
      SONAR_TOKEN: $(SONAR_TOKEN)

  # Paso 8: Publicar el Artefacto (Guardar el .jar de la aplicación)
  - task: PublishPipelineArtifact@1
    displayName: 'Artefacto en Azure'
    inputs:
      targetPath: '$(projectDir)/build/libs'
      artifact: 'Calculadora-App'
      publishLocation: 'pipeline'

  # Paso 9: Preparar directorios para JMeter
  - script: |
      echo "Preparando carpeta de resultados..."
      if not exist $(resultsFolder) mkdir $(resultsFolder)
    displayName: "Preparar directorios JMeter"


  # PASO 10: Levantar la aplicación en Docker antes de JMeter
  - script: |
      echo "Limpiando cualquier contenedor previo para evitar conflictos..."
      docker-compose down
      echo "Encendiendo la calculadora en Docker..."
      docker-compose up -d --force-recreate
      echo "Esperando 15 segundos a que Spring Boot inicie por completo..."
      ping 127.0.0.1 -n 16 > nul
    displayName: "Docker: Levantar Contenedor"
    workingDirectory: '$(projectDir)'

  # Paso 11: Ejecutar prueba de rendimiento con JMeter (Modo No-GUI)
  - script: |
      echo "Ejecutando prueba de rendimiento con JMeter desde el Disco C..."
      "C:\apache-jmeter-5.6.3\bin\jmeter.bat" -n -t "$(jmxFile)" -l "$(resultsFile)" -e -o "$(htmlReport)"
    displayName: "Ejecución de prueba JMeter"


  # PASO 12: Apagar y limpiar contenedores (SIEMPRE SE EJECUTA)
  - script: |
      echo "Apagando contenedores y liberando puertos..."
      docker-compose down
    displayName: "Docker: Apagar y Limpiar"
    workingDirectory: '$(projectDir)'
    condition: always() # Obliga a que corra incluso si las pruebas de JMeter fallan

  # Paso 13: Publicar reporte HTML de JMeter como Artefacto
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(htmlReport)'
      ArtifactName: 'jmeter-report'
      publishLocation: 'Container'
    displayName: "Publicar reporte HTML de JMeter"